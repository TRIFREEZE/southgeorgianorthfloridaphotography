name: CI

# Vercel builds and deploys every push through its GitHub integration.
# This workflow runs the same quality gates so a broken commit is flagged on the PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
